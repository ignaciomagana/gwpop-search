[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gwpop-search"
version = "0.2.0"
description = "Systematic gravitational-wave population-model search with standardized HBI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "gwpop-search contributors"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
inference = [
    "jax",
    "numpyro",
    "arviz",
]
evidence = [
    "gwpop-search[inference]",
    "jaxns>=2.6.9",
]
dev = [
    "gwpop-search[evidence]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
]

[project.scripts]
gwpop-search = "gwpop_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
